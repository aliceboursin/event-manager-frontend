<div class="container">
    <main class="form-container mt-5">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="username" class="form-label">Username:</label>
          <input
            type="text"
            class="form-control"
            id="username"
            autocomplete="off"
            placeholder="Username"
            formControlName="username"
            [class.is-invalid]="username.invalid && username.touched"
            [class.is-valid]="username.valid && username.touched"
          />
          <div *ngIf="username.invalid && username.touched" class="invalid-feedback">
            <div *ngIf="username.errors?.['required']">Username is required</div>
          </div>
        </div>
  
        <div class="mb-3">
          <label for="password" class="form-label">Password:</label>
          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="Password"
            formControlName="password"
            [class.is-invalid]="password.invalid && password.touched"
            [class.is-valid]="password.valid && password.touched"
          />
          <div *ngIf="password.invalid && password.touched" class="invalid-feedback">
            <div *ngIf="password.errors?.['required']">Password is required</div>
          </div>
        </div>
  
        <div class="button-container">
            <button type="submit" class="btn btn-primary mb-2">Login</button>
            <button type="button" class="btn btn-outline-primary mb-3" [routerLink]="['/']">Sign up</button>
        </div>
      </form>
    </main>
  </div>
