<div class="container">
  <main class="mt-5">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <a href="#" class="back-link" (click)="closeDialog()"> <i class="fa fa-arrow-left" aria-hidden="true"></i> Back</a>
      <h2 class="form-title">LOGIN</h2>
      <div class="mb-3">
        <input
          type="username"
          class="form-control"
          id="username"
          autocomplete="off"
          placeholder="Username"
          formControlName="username"
          [class.is-invalid]="username.invalid && (username.touched || isSubmitted)"
          [class.is-valid]="username.valid && (username.touched || isSubmitted)"
        />
        <div *ngIf="username.invalid && (username.touched || isSubmitted)" class="invalid-feedback">
          <div *ngIf="username.errors?.['required']">Email is required</div>
        </div>
      </div>

      <div class="mb-3">
        <input
          type="password"
          class="form-control"
          id="password"
          placeholder="Password"
          formControlName="password"
          [class.is-invalid]="password.invalid && (password.touched || isSubmitted)"
          [class.is-valid]="password.valid && (password.touched || isSubmitted)"
        />
        <div *ngIf="password.invalid && (password.touched || isSubmitted)" class="invalid-feedback">
          <div *ngIf="password.errors?.['required']">Password is required</div>
        </div>
      </div>

      <div class="button-container">
        <button type="submit" class="btn btn-primary mb-2">LOGIN</button>
      </div>
  <!-- <div class="signup-link">
        New here ? <a [routerLink]="['/signup']">Sign Up</a>
      </div>
    -->
    </form>
  </main>
</div>
