<div class="category-page">

  <app-top-bar-logged></app-top-bar-logged>

  <div class="category-list">
    <app-category-list-item *ngFor="let category of categories" [category]="category"></app-category-list-item>
  </div>

  <div *ngIf="!categories || categories.length === 0">
    <p>No categories available.</p>
  </div>

</div>
