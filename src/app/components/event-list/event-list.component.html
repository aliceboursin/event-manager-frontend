<div class="event-page">
  <app-top-bar-logged></app-top-bar-logged>

  <h2>{{title}}</h2>

  <app-filter-bar (filtersApplied)="onFiltersApplied($event)"></app-filter-bar>

  <div class="event-list">
    <div *ngFor="let event of filteredEvents">
      <app-event-list-item [event]="event" class="event-item"></app-event-list-item>
    </div>
    <div *ngIf="!filteredEvents || filteredEvents.length === 0">
      <p>No events available.</p>
    </div>
  </div>
</div>
