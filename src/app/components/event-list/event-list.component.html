<div class="event-page">

  <app-top-bar-logged></app-top-bar-logged>
  @if (cities$ | async; as cities) {
    <p>All cities :
      @for (city of cities; track city) {
        <button (click)="loadEventsByCity(city)">{{ city }}</button>
      }
    </p>
  }

  <button (click)="goToPassedEvents()">Passed events</button>
  <button (click)="goToUpcomingEvents()">Upcoming events</button>
  <div class="event-list">
    @if (events$ | async; as events) {
      @for (event of events; track event) {
        <!--Ne pas oublier de retirer le *ngFor si on fait @for :// -->
      <app-event-list-item [event]="event" class="event-item"></app-event-list-item>
      }
    } @else {
      <div>
        <p>No events available.</p>
      </div>
    }
  </div>

</div>
